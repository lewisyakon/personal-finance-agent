services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      # This affects only RUN steps while building the image. Runtime remains
      # on Docker's bridge network. Use PFA_BUILD_NETWORK=host when the host
      # network path is more reliable than Docker's bridge/DNS path.
      network: "${PFA_BUILD_NETWORK:-default}"
      args:
        PIP_INDEX_URL: "${PFA_PIP_INDEX_URL:-https://pypi.org/simple}"
        PFA_INSTALL_EXTRAS: "${PFA_BACKEND_EXTRAS:-}"
    working_dir: /opt/backend
    # The wrapper script exports the host UID/GID. The defaults keep direct
    # `docker compose` usage usable on the common Linux UID 1000 setup.
    user: "${PFA_UID:-1000}:${PFA_GID:-1000}"
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      PYTHONPATH: /workspace/backend
      DATABASE_URL: sqlite:////workspace/data/personal_finance.db
      DATA_DIR: /workspace/data
      APP_MODE: "${APP_MODE:-local}"
      DEVELOPER_ENABLED: "${DEVELOPER_ENABLED:-true}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Shanghai}"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-mock-model}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-30}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-2}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-1024}"
      AGENT_MAX_CONTEXT_CHARS: "${AGENT_MAX_CONTEXT_CHARS:-131072}"
      LLM_INPUT_COST_PER_MILLION_MICROUSD: "${LLM_INPUT_COST_PER_MILLION_MICROUSD:-0}"
      LLM_OUTPUT_COST_PER_MILLION_MICROUSD: "${LLM_OUTPUT_COST_PER_MILLION_MICROUSD:-0}"
      TOOL_TIMEOUT_SECONDS: "${TOOL_TIMEOUT_SECONDS:-5}"
      TOOL_MAX_RESULT_BYTES: "${TOOL_MAX_RESULT_BYTES:-524288}"
      AGENT_MAX_STEPS: "${AGENT_MAX_STEPS:-12}"
      AGENT_MAX_TOOL_CALLS: "${AGENT_MAX_TOOL_CALLS:-8}"
      AGENT_MAX_MODEL_CALLS: "${AGENT_MAX_MODEL_CALLS:-8}"
      AGENT_TOTAL_TIMEOUT_SECONDS: "${AGENT_TOTAL_TIMEOUT_SECONDS:-120}"
      AGENT_MAX_TOTAL_TOKENS: "${AGENT_MAX_TOTAL_TOKENS:-32000}"
      AGENT_MAX_REPLANS: "${AGENT_MAX_REPLANS:-1}"
      AGENT_MAX_COST_MICROUSD: "${AGENT_MAX_COST_MICROUSD:-100000}"
      PLANNER_PARALLEL_WORKERS: "${PLANNER_PARALLEL_WORKERS:-4}"
      SEMANTIC_AUTO_APPLY_THRESHOLD: "${SEMANTIC_AUTO_APPLY_THRESHOLD:-0.85}"
      SEMANTIC_MAX_CATEGORIES: "${SEMANTIC_MAX_CATEGORIES:-100}"
      RAW_FILE_TTL_MINUTES: "${RAW_FILE_TTL_MINUTES:-60}"
      FINGERPRINT_SECRET: "${FINGERPRINT_SECRET:-local-development-fingerprint-secret}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-20971520}"
      ARCHIVE_MAX_ENTRIES: "${ARCHIVE_MAX_ENTRIES:-2000}"
      ARCHIVE_MAX_UNCOMPRESSED_BYTES: "${ARCHIVE_MAX_UNCOMPRESSED_BYTES:-104857600}"
      ARCHIVE_MAX_ENTRY_BYTES: "${ARCHIVE_MAX_ENTRY_BYTES:-26214400}"
      ARCHIVE_MAX_COMPRESSION_RATIO: "${ARCHIVE_MAX_COMPRESSION_RATIO:-200}"
      DATA_EXPORT_MAX_BYTES: "${DATA_EXPORT_MAX_BYTES:-52428800}"
      BACKUP_MAX_BYTES: "${BACKUP_MAX_BYTES:-2147483648}"
      DATA_CONFIRMATION_TTL_SECONDS: "${DATA_CONFIRMATION_TTL_SECONDS:-300}"
      LOCAL_ALLOWED_HOSTS: "${LOCAL_ALLOWED_HOSTS:-127.0.0.1,localhost,[::1],testserver}"
      LOCAL_OWNER_ID: "${LOCAL_OWNER_ID:-local-owner}"
    ports:
      # Do not expose the local finance API on all host interfaces.
      - "127.0.0.1:8000:8000"
    volumes:
      - "${PFA_DATA_DIR:-./data}:/workspace/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: "${PFA_BUILD_NETWORK:-default}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
